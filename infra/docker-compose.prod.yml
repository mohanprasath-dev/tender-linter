services:
  db:
    image: postgres:16-alpine
    container_name: tender_linter_prod_db
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tender_linter_prod}
      POSTGRES_USER: ${POSTGRES_USER:-tender_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Database password required}
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tender_admin} -d ${POSTGRES_DB:-tender_linter_prod}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1G
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    container_name: tender_linter_prod_api
    restart: always
    command: ["uvicorn", "apps.api.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "4"]
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-tender_admin}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-tender_linter_prod}
      OBJECT_STORE_PATH: /app/object_store
      ENVIRONMENT: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      JWT_SECRET: ${JWT_SECRET:?JWT secret key required}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-https://tender-linter.gov.in}
      PROVIDER_PRIMARY: ${PROVIDER_PRIMARY:-}
      MODEL_ID_PRIMARY: ${MODEL_ID_PRIMARY:-}
      PROVIDER_PRIMARY_KEY: ${PROVIDER_PRIMARY_KEY:-}
      RETENTION_DAYS: ${RETENTION_DAYS:-30}
    volumes:
      - object_store_prod:/app/object_store
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 1.5G
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    container_name: tender_linter_prod_web
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

volumes:
  pgdata_prod:
  object_store_prod:
